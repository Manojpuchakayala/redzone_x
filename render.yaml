services:
  # Backend Node.js Service with MongoDB Atlas
  - type: web
    name: redzone-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        value: mongodb+srv://manojj:RedZone2026%21@consumer-trust-db.rxdifnq.mongodb.net/redzone_x?retryWrites=true&w=majority&appName=consumer-trust-db
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: redzone_x_emergency_secret_key_2026

  # Frontend Static Site
  - type: web
    name: redzone-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
